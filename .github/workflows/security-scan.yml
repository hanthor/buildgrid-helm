name: Security Scan

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'Chart.yaml'
      - 'values*.yaml'
      - 'templates/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'Chart.yaml'
      - 'values*.yaml'
      - 'templates/**'
  schedule:
    - cron:
  workflow_dispatch: '0 0 * * 0'  # Weekly scan

jobs:
  security-scan:
    name: Security Scan - Helm Chart
    runs-on:
  workflow_dispatch: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version:
  workflow_dispatch: 'latest'

      - name: Render templates
        run: |
          helm template buildgrid . \
            --values ./values.yaml \
            > /tmp/buildgrid-manifests.yaml

      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: '/tmp/buildgrid-manifests.yaml'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Check for security issues in templates
        run: |
          echo "🔒 Checking for security best practices..."
          
          MANIFEST=/tmp/buildgrid-manifests.yaml
          ERRORS=0
          
          # Check for privileged containers
          if grep -q "privileged: true" "$MANIFEST"; then
            echo "⚠️  Warning: Found privileged: true"
            ERRORS=$((ERRORS + 1))
          fi
          
          # Check for root user
          if grep -q "runAsUser: 0" "$MANIFEST" && ! grep -q "containers:" "$MANIFEST"; then
            echo "⚠️  Warning: Containers running as root"
            ERRORS=$((ERRORS + 1))
          fi
          
          # Check for resource limits
          if ! grep -q "limits:" "$MANIFEST"; then
            echo "⚠️  Warning: Some containers missing resource limits"
            ERRORS=$((ERRORS + 1))
          fi
          
          # Check for readiness probes
          if ! grep -q "readinessProbe:" "$MANIFEST"; then
            echo "⚠️  Warning: Missing readiness probes"
            ERRORS=$((ERRORS + 1))
          fi
          
          # Check for liveness probes
          if ! grep -q "livenessProbe:" "$MANIFEST"; then
            echo "⚠️  Warning: Missing liveness probes"
            ERRORS=$((ERRORS + 1))
          fi
          
          if [ $ERRORS -gt 0 ]; then
            echo "⚠️  Found $ERRORS security concerns"
          else
            echo "✅ No critical security issues found"
          fi

  policy-check:
    name: Policy Check - RBAC & Network Policy
    runs-on:
  workflow_dispatch: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version:
  workflow_dispatch: 'latest'

      - name: Check RBAC configuration
        run: |
          echo "🔐 Checking RBAC configuration..."
          
          CHART_DIR="./buildgrid-helm"
          
          # Check for ServiceAccount
          if grep -r "kind: ServiceAccount" "$CHART_DIR/templates/" > /dev/null; then
            echo "✅ ServiceAccount found"
          else
            echo "⚠️  No ServiceAccount found"
          fi
          
          # Check for RBAC resources
          if grep -r "kind: Role\|kind: ClusterRole" "$CHART_DIR/templates/" > /dev/null; then
            echo "✅ RBAC roles configured"
          else
            echo "⚠️  No RBAC roles found"
          fi
          
          # Check for ClusterRoleBinding
          if grep -r "kind: RoleBinding\|kind: ClusterRoleBinding" "$CHART_DIR/templates/" > /dev/null; then
            echo "✅ RBAC bindings configured"
          else
            echo "⚠️  No RBAC bindings found"
          fi

      - name: Check Network Policies
        run: |
          echo "🌐 Checking Network Policies..."
          
          CHART_DIR="./buildgrid-helm"
          
          if grep -r "kind: NetworkPolicy" "$CHART_DIR/templates/" > /dev/null; then
            echo "✅ NetworkPolicy found"
          else
            echo "ℹ️  No NetworkPolicy defined (optional)"
          fi

  dependency-check:
    name: Check Chart Dependencies
    runs-on:
  workflow_dispatch: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version:
  workflow_dispatch: 'latest'

      - name: Check Chart.yaml dependencies
        run: |
          echo "📦 Checking chart dependencies..."
          
          CHART_FILE="./Chart.yaml"
          
          if grep -q "^dependencies:" "$CHART_FILE"; then
            echo "ℹ️  Chart has dependencies"
            grep -A 20 "^dependencies:" "$CHART_FILE"
            
            echo "Updating dependencies..."
            helm dependency update ./buildgrid-helm
          else
            echo "✅ Chart has no external dependencies"
          fi

  changelog-check:
    name: Validate CHANGELOG
    runs-on:
  workflow_dispatch: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check CHANGELOG format
        run: |
          echo "📝 Validating CHANGELOG.md..."
          
          CHANGELOG="./CHANGELOG.md"
          
          if [ ! -f "$CHANGELOG" ]; then
            echo "⚠️  CHANGELOG.md not found"
            exit 1
          fi
          
          # Check for version headers
          if grep -q "^## \[" "$CHANGELOG"; then
            echo "✅ CHANGELOG has version headers"
          else
            echo "⚠️  CHANGELOG missing version headers"
          fi
          
          # Check for unreleased section
          if grep -q "^## \[Unreleased\]" "$CHANGELOG"; then
            echo "✅ CHANGELOG has Unreleased section"
          fi
          
          # Get current chart version
          VERSION=$(grep "^version:
  workflow_dispatch:" ./Chart.yaml | awk '{print $2}')
          
          if grep -q "^## \[$VERSION\]" "$CHANGELOG"; then
            echo "✅ CHANGELOG has entry for version $VERSION"
          else
            echo "⚠️  CHANGELOG missing entry for version $VERSION"
          fi
