name: Security Scan

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'Chart.yaml'
      - 'values*.yaml'
      - 'templates/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'Chart.yaml'
      - 'values*.yaml'
      - 'templates/**'
  schedule:
    - cron: '0 0 * * 0'  # Weekly scan

jobs:
  security-scan:
    name: Security Scan - Helm Chart
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'latest'

      - name: Render templates
        run: |
          helm template buildgrid . \
            --values ./values.yaml \
            > /tmp/buildgrid-manifests.yaml

      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: '/tmp/buildgrid-manifests.yaml'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Check for security issues in templates
        run: |
          echo "Checking for security best practices..."
          
          MANIFEST=/tmp/buildgrid-manifests.yaml
          ERRORS=0
          
          if grep -q "privileged: true" "$MANIFEST"; then
            echo "Warning: Found privileged: true"
            ERRORS=$((ERRORS + 1))
          fi
          
          if grep -q "runAsUser: 0" "$MANIFEST" && ! grep -q "containers:" "$MANIFEST"; then
            echo "Warning: Containers running as root"
            ERRORS=$((ERRORS + 1))
          fi
          
          if ! grep -q "limits:" "$MANIFEST"; then
            echo "Warning: Some containers missing resource limits"
            ERRORS=$((ERRORS + 1))
          fi
          
          if [ $ERRORS -gt 0 ]; then
            echo "Found $ERRORS security concerns"
          else
            echo "No critical security issues found"
          fi

  policy-check:
    name: Policy Check - RBAC & Network Policy
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'latest'

      - name: Check RBAC configuration
        run: |
          echo "Checking RBAC configuration..."
          
          CHART_DIR="./templates"
          
          if grep -r "kind: ServiceAccount" "$CHART_DIR/" > /dev/null 2>&1; then
            echo "ServiceAccount found"
          else
            echo "No ServiceAccount found"
          fi
          
          if grep -r "kind: Role\|kind: ClusterRole" "$CHART_DIR/" > /dev/null 2>&1; then
            echo "RBAC roles configured"
          else
            echo "No RBAC roles found"
          fi

      - name: Check Network Policies
        run: |
          echo "Checking Network Policies..."
          
          if grep -r "kind: NetworkPolicy" "./templates/" > /dev/null 2>&1; then
            echo "NetworkPolicy found"
          else
            echo "No NetworkPolicy defined (optional)"
          fi

  dependency-check:
    name: Check Chart Dependencies
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'latest'

      - name: Check Chart.yaml dependencies
        run: |
          echo "Checking chart dependencies..."
          
          if grep -q "^dependencies:" "./Chart.yaml"; then
            echo "Chart has dependencies"
            grep -A 20 "^dependencies:" "./Chart.yaml"
            helm dependency update .
          else
            echo "Chart has no external dependencies"
          fi

  changelog-check:
    name: Validate CHANGELOG
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check CHANGELOG format
        run: |
          echo "Validating CHANGELOG.md..."
          
          CHANGELOG="./CHANGELOG.md"
          
          if [ ! -f "$CHANGELOG" ]; then
            echo "CHANGELOG.md not found"
            exit 1
          fi
          
          if grep -q "^## \[" "$CHANGELOG"; then
            echo "CHANGELOG has version headers"
          fi
          
          VERSION=$(grep "^version:" ./Chart.yaml | awk '{print $2}')
          
          if grep -q "^## \[$VERSION\]" "$CHANGELOG"; then
            echo "CHANGELOG has entry for version $VERSION"
          else
            echo "Note: CHANGELOG missing entry for version $VERSION (non-blocking)"
          fi
