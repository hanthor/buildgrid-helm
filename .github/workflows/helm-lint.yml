name: Helm Lint

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'Chart.yaml'
      - 'values*.yaml'
      - 'templates/**'
      - '.github/workflows/helm-lint.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'Chart.yaml'
      - 'values*.yaml'
      - 'templates/**'

jobs:
  lint:
    name: Lint Helm Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'latest'

      - name: Add Helm repositories
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo update

      - name: Lint BuildGrid Chart
        run: |
          helm lint ./buildgrid-helm \
            --values ./buildgrid-helm/values.yaml \
            --values ./buildgrid-helm/values-example-production.yaml \
            --values ./buildgrid-helm/values-bihar.yaml \
            --strict

      - name: Template validation
        run: |
          helm template buildgrid ./buildgrid-helm \
            --values ./buildgrid-helm/values.yaml \
            > /tmp/buildgrid-manifest.yaml
          
          echo "Generated manifest has $(grep -c "^---$" /tmp/buildgrid-manifest.yaml || echo "1") resources"

      - name: Validate generated manifests
        run: |
          # Check for common issues
          if grep -q "{{ .Values" /tmp/buildgrid-manifest.yaml; then
            echo "❌ Error: Unresolved template variables found!"
            exit 1
          fi
          echo "✅ All template variables resolved"

      - name: Check for deprecated APIs
        run: |
          # Warn about deprecated Kubernetes APIs
          if grep -q "apiVersion: extensions/v1beta1" /tmp/buildgrid-manifest.yaml; then
            echo "⚠️  Warning: Using deprecated extensions/v1beta1"
          fi
          if grep -q "apiVersion: apps/v1beta" /tmp/buildgrid-manifest.yaml; then
            echo "⚠️  Warning: Using deprecated apps/v1beta"
          fi

  values-schema:
    name: Validate Values Schema
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Validate YAML syntax
        run: |
          python3 << 'EOF'
          import yaml
          import sys
          
          files = [
              './buildgrid-helm/values.yaml',
              './buildgrid-helm/values-bihar.yaml',
              './buildgrid-helm/values-example-production.yaml',
              './buildgrid-helm/values-example-dev.yaml'
          ]
          
          for filepath in files:
              try:
                  with open(filepath, 'r') as f:
                      yaml.safe_load(f)
                  print(f"✅ {filepath} - valid YAML")
              except yaml.YAMLError as e:
                  print(f"❌ {filepath} - YAML error: {e}")
                  sys.exit(1)
              except FileNotFoundError:
                  print(f"⚠️  {filepath} - file not found")
          
          print("\n✅ All YAML files are valid!")
          EOF

  documentation:
    name: Check Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify README exists
        run: |
          if [ ! -f "./buildgrid-helm/README.md" ]; then
            echo "❌ Error: README.md not found"
            exit 1
          fi
          echo "✅ README.md exists"

      - name: Verify CHANGELOG exists
        run: |
          if [ ! -f "./buildgrid-helm/CHANGELOG.md" ]; then
            echo "❌ Error: CHANGELOG.md not found"
            exit 1
          fi
          echo "✅ CHANGELOG.md exists"

      - name: Check Chart.yaml has description
        run: |
          if ! grep -q "description:" ./buildgrid-helm/Chart.yaml; then
            echo "❌ Error: Chart.yaml missing description"
            exit 1
          fi
          echo "✅ Chart.yaml has description"

      - name: Verify version format
        run: |
          VERSION=$(grep "^version:" ./buildgrid-helm/Chart.yaml | awk '{print $2}')
          if ! [[ $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Error: Invalid version format: $VERSION"
            echo "   Expected format: x.y.z (e.g., 0.2.0)"
            exit 1
          fi
          echo "✅ Chart version is valid: $VERSION"
