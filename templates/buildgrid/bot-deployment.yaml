{{- if .Values.buildgrid.bot.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "buildgrid.fullname" . }}-bot
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "buildgrid.labels" . | nindent 4 }}
    app.kubernetes.io/component: bot
spec:
  replicas: {{ .Values.buildgrid.bot.replicaCount }}
  selector:
    matchLabels:
      {{- include "buildgrid.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: bot
  template:
    metadata:
      labels:
        {{- include "buildgrid.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: bot
    spec:
      serviceAccountName: {{ include "buildgrid.serviceAccountName" . }}
      # buildbox needs FUSE and privileged for input root staging
      securityContext:
        runAsUser: 0
      initContainers:
        - name: wait-for-server
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z {{ include "buildgrid.fullname" . }}-server {{ .Values.buildgrid.server.grpcPort }}; do
                echo "Waiting for BuildGrid server..."
                sleep 2
              done
      containers:
        - name: buildbox
          image: "{{ .Values.buildgrid.bot.image.repository }}:{{ .Values.buildgrid.bot.image.tag }}"
          imagePullPolicy: {{ .Values.buildgrid.bot.image.pullPolicy }}
          securityContext:
            privileged: true
          # Run casd in background then start worker (mirrors docker-compose quickstart)
          command:
            - sh
            - -c
            - |
              set -e
              SERVER={{ include "buildgrid.fullname" . }}-server:{{ .Values.buildgrid.server.grpcPort }}
              echo "Starting buildbox-casd..."
              buildbox-casd \
                --cas-remote=http://${SERVER} \
                --bind=localhost:50011 \
                /var/buildgrid/casd &
              CASD_PID=$!

              # Wait for casd to be ready (nc -z not available in buildbox)
              echo "Waiting for buildbox-casd to start..."
              until grep -q "C35B\|C3D3" /proc/net/tcp6 2>/dev/null || grep -q "C35B\|C3D3" /proc/net/tcp 2>/dev/null; do sleep 1; done
              echo "buildbox-casd ready"

              exec buildbox-worker \
                --buildbox-run=/usr/local/bin/buildbox-run-bubblewrap \
                --cas-remote=http://localhost:50011 \
                --bots-remote=http://${SERVER} \
                --platform OSFamily=linux \
                --platform ISA=x86-64 \
                --verbose
          resources:
            {{- toYaml .Values.buildgrid.bot.resources | nindent 12 }}
          volumeMounts:
            - name: bot-storage
              mountPath: /var/buildgrid/casd
            - name: fuse
              mountPath: /dev/fuse
      volumes:
        - name: bot-storage
          emptyDir: {}
        - name: fuse
          hostPath:
            path: /dev/fuse
      {{- with .Values.buildgrid.bot.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
