{{- if .Values.dashboard.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "buildgrid.fullname" . }}-dashboard
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "buildgrid.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "buildgrid.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: dashboard
  template:
    metadata:
      labels:
        {{- include "buildgrid.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: dashboard
    spec:
      serviceAccountName: {{ include "buildgrid.serviceAccountName" . }}
      containers:
        - name: dashboard
          image: "{{ .Values.dashboard.image.repository }}:{{ .Values.dashboard.image.tag }}"
          imagePullPolicy: {{ .Values.dashboard.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.dashboard.port }}
          env:
            - name: DASHBOARD_PORT
              value: {{ .Values.dashboard.port | quote }}
            - name: BUILDGRID_NS
              value: {{ .Values.namespace.name | quote }}
            - name: BUILDGRID_HOST
              value: {{ .Values.dashboard.buildgridHost | quote }}
            - name: BUILDGRID_ENDPOINT
              value: {{ .Values.dashboard.buildgridEndpoint | quote }}
            - name: PGHOST
              value: {{ include "buildgrid.fullname" . }}-postgresql
            - name: PGUSER
              value: {{ .Values.postgresql.auth.username | quote }}
            - name: PGDATABASE
              value: {{ .Values.postgresql.auth.database | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "buildgrid.fullname" . }}-postgresql-secret
                  key: password
          {{- if .Values.dashboard.projectsConfigMap }}
          volumeMounts:
            - name: projects-config
              mountPath: /app/projects.json
              subPath: projects.json
          {{- end }}
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /api/projects
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      {{- if .Values.dashboard.projectsConfigMap }}
      volumes:
        - name: projects-config
          configMap:
            name: {{ .Values.dashboard.projectsConfigMap }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "buildgrid.fullname" . }}-dashboard
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "buildgrid.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
  {{- if .Values.dashboard.tailscale.enabled }}
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: {{ .Values.dashboard.tailscale.hostname | quote }}
    tailscale.com/proxy-class: {{ .Values.dashboard.tailscale.proxyClass | quote }}
  {{- end }}
spec:
  type: {{ if .Values.dashboard.tailscale.enabled }}LoadBalancer{{ else }}ClusterIP{{ end }}
  {{- if .Values.dashboard.tailscale.enabled }}
  loadBalancerClass: tailscale
  {{- end }}
  ports:
    - port: {{ .Values.dashboard.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "buildgrid.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
{{- end }}
