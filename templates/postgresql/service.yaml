{{- if .Values.postgresql.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "buildgrid.fullname" . }}-postgresql
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "buildgrid.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.postgresql.primary.port }}
      targetPort: postgresql
      protocol: TCP
      name: postgresql
  selector:
    {{- include "buildgrid.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
{{- end }}
