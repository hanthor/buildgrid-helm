# Bihar K3S deployment values
# Remote server: bihar (192.168.0.5 / 100.85.9.86 Tailscale)
# Usage: helm install buildgrid . -f values-bihar.yaml -n buildgrid --create-namespace

global:
  serviceType: LoadBalancer
  loadBalancerClass: tailscale
  serviceAnnotations:
    tailscale.com/hostname: "buildgrid"
    tailscale.com/proxy-class: "on-bihar"

buildgrid:
  image:
    repository: localhost/buildgrid
    tag: "local"
    pullPolicy: Never  # Use locally imported image

  server:
    replicaCount: 1
    grpcPort: 50051
    nodePort: 30051
    threadPoolSize: 100
    resources:
      requests:
        memory: "2Gi"  # reduced from 4Gi for more bot capacity
        cpu: "1"       # reduced from 2 - more efficient
      limits:
        memory: "8Gi"  # reduced from 16Gi
        cpu: "4"       # kept at 4 for burst capacity

  bot:
    enabled: true
    replicaCount: 40  # Bihar 20 + karnataka 20
    image:
      repository: registry.gitlab.com/buildgrid/buildgrid.hub.docker.com/buildbox
      tag: "nightly"
      pullPolicy: Always
    resources:
      requests:
        memory: "512Mi"  # reduced from 1Gi - aggressive packing
        cpu: "0.4"       # reduced from 1 - more bots fit on hardware
      limits:
        memory: "4Gi"    # reduced from 8Gi - saves memory pressure
        cpu: "2"         # reduced from 4 - but has burst room

  storage:
    # Use disk storage backed by PVC — LRU OOMs on large builds like Qt6
    useDisk: true
    persistence:
      enabled: true
      size: "200Gi"
      storageClassName: "local-path"
      accessMode: ReadWriteOnce
    lruSize: "2048M"  # fallback if disk disabled

postgresql:
  enabled: true
  image:
    repository: postgres
    tag: "14-alpine"
    pullPolicy: IfNotPresent
  auth:
    username: bgd
    password: "buildgrid-bihar"
    database: bgd
    superuserPassword: "buildgrid-bihar-super"
  primary:
    persistence:
      enabled: true
      size: "20Gi"
      storageClassName: "local-path"
      accessMode: ReadWriteOnce
    resources:
      requests:
        memory: "256Mi"
        cpu: "250m"
      limits:
        memory: "1Gi"
        cpu: "1"

redis:
  enabled: true
  image:
    repository: redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent
  auth:
    enabled: false  # internal cluster only, no auth needed
  master:
    persistence:
      enabled: false  # Redis is a cache, no need to persist
    resources:
      requests:
        memory: "512Mi"
        cpu: "250m"
      limits:
        memory: "4Gi"
        cpu: "1"

ingress:
  enabled: false

monitoring:
  enabled: true
  prometheus:
    enabled: true
    interval: "15s"

podDisruptionBudget:
  enabled: false

backup:
  enabled: false

logging:
  level: "INFO"

dashboard:
  enabled: true
  port: 8765
  buildgridHost: "localhost"
  # IMPORTANT: Use internal K8S service DNS for pod-to-pod communication
  # WRONG: buildgrid.manatee-basking.ts.net (Tailscale - not resolvable in pod network)
  # RIGHT: buildgrid-server (K8S service name - resolves via CoreDNS)
  # External clients use: grpc://buildgrid.manatee-basking.ts.net:50051
  buildgridEndpoint: "grpc://buildgrid-server:50051"
  image:
    repository: localhost/buildgrid-dashboard
    tag: "local"
    pullPolicy: Never
  tailscale:
    enabled: true
    hostname: "buildgrid-dashboard"
    proxyClass: "on-bihar"
